<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Personal Profile</title>
  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons for brand logos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    :root {
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.7);
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-glow: rgba(255, 255, 255, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Outfit', sans-serif;
      color: var(--text-primary);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      padding-bottom: calc(1.5rem + env(safe-area-inset-bottom));
      padding-top: calc(1.5rem + env(safe-area-inset-top));
      overflow-x: hidden;
      background: #050508;
      position: relative;
    }

    /* Motion Background Canvas */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }

    /* Floating Glass Card Container */
    .profile-card {
      width: 100%;
      max-width: 500px;
      text-align: center;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(25px) saturate(190%);
      -webkit-backdrop-filter: blur(25px) saturate(190%);
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      padding: 2.5rem 1.75rem 2rem;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), 
                  inset 0 1px 0 rgba(255, 255, 255, 0.2);
      animation: cardAppear 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      position: relative;
      z-index: 10;
      transition: border-color 0.4s ease, box-shadow 0.4s ease, transform 0.4s ease;
    }

    /* Interactive hover on the card itself */
    .profile-card:hover {
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 35px 70px rgba(0, 0, 0, 0.5), 
                  0 0 30px rgba(255, 255, 255, 0.05),
                  inset 0 1px 0 rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Professional Avatar styling with active states */
    .avatar-container {
      position: relative;
      width: 160px;
      height: 160px;
      margin: 0 auto 1.5rem;
      cursor: pointer;
    }

    .avatar-glass-ring {
      position: absolute;
      inset: -6px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      z-index: 1;
      pointer-events: none;
      animation: rotateRing 10s linear infinite;
      transition: border-color 0.4s ease, scale 0.4s ease;
    }

    .avatar-container:hover .avatar-glass-ring {
      border-color: rgba(255, 255, 255, 0.6);
      scale: 1.05;
    }

    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease;
    }

    .avatar-container:hover .avatar-img {
      transform: scale(1.03) rotate(3deg);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .profile-name {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
      transition: color 0.3s ease;
      cursor: default;
    }

    .profile-name:hover {
      color: rgba(255, 255, 255, 0.85);
    }

    .profile-bio {
      font-size: 1.2rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 2.25rem;
      font-weight: 300;
      transition: color 0.3s ease;
      cursor: default;
    }

    .profile-bio:hover {
      color: #ffffff;
    }

    /* Social Link Buttons with Rich Hover States */
    .social-links {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .social-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 1.5rem;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      color: var(--text-primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 1.25rem;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .social-link:active {
      transform: scale(0.97);
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--glass-glow);
    }

    @media (hover: hover) {
      .social-link:hover {
        background: rgba(255, 255, 255, 0.12);
        border-color: var(--glass-glow);
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25), 
                    inset 0 1px 0 rgba(255, 255, 255, 0.15);
      }
    }

    .social-left {
      display: flex;
      align-items: center;
      gap: 0.9rem;
    }

    .social-left i {
      font-size: 1.45rem;
      width: 28px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.3s ease;
    }

    /* Brand coloring and rotation on hover */
    .social-link:hover .social-left i {
      transform: scale(1.15) rotate(-5deg);
    }

    .social-link:hover .fa-facebook { color: #1877f2; }
    .social-link:hover .fa-tiktok { color: #ff0050; }
    .social-link:hover .fa-instagram { color: #e1306c; }
    .social-link:hover .fa-telegram { color: #24a1de; }
    .social-link:hover .fa-whatsapp { color: #25d366; }

    .chevron-icon {
      opacity: 0.3;
      transition: transform 0.3s ease, opacity 0.3s ease, color 0.3s ease;
      font-size: 0.85rem;
    }

    .social-link:hover .chevron-icon {
      opacity: 0.85;
      transform: translate(2px, -2px);
      color: rgba(255, 255, 255, 0.9);
    }

    .footer {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      z-index: 10;
    }

    .created-by-container {
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 0.8rem;
      width: 320px;
      transition: border-color 0.3s ease, transform 0.3s ease;
      cursor: pointer;
    }

    .created-by-container:hover {
      border-color: rgba(255, 255, 255, 0.35);
      transform: scale(1.06);
    }

    .creator-logo {
      height: 90px; /* Set logo to be clearly visible and much larger */
      width: auto;
      object-fit: contain;
      opacity: 0.45;
      transition: opacity 0.3s ease;
    }

    .created-by-container:hover .creator-logo {
      opacity: 0.95;
    }

    /* Complete responsive layouts for smaller iOS & Android touch devices */
    @media (max-width: 480px) {
      body {
        padding: 1rem 0.75rem;
      }
      .profile-card {
        border-radius: 28px;
        padding: 2.25rem 1.25rem 1.75rem;
      }
      .profile-name {
        font-size: 1.45rem;
      }
      .profile-bio {
        font-size: 0.9rem;
        margin-bottom: 1.5rem;
      }
      .social-link {
        padding: 0.9rem 1.1rem;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>

  <!-- Dynamic Motion Background -->
  <canvas id="bg-canvas"></canvas>

  <div class="profile-card">
    <div class="avatar-container">
      <div class="avatar-glass-ring"></div>
      <img src="./copy  (1).jpg" alt="Profile Avatar" class="avatar-img">
    </div>

    <h1 class="profile-name">𝐁𝐄𝐋𝐀𝐋 𝐀𝐇𝐌𝐄𝐃</h1>
    <p class="profile-bio">
      Connecting, creating, and sharing stories. Explore my social handles below and let's get in touch!
    </p>

    <div class="social-links">
      <a href="https://www.facebook.com/blal.ahmed.abd.elrehem/" target="_blank" class="social-link" id="link-facebook">
        <div class="social-left">
          <i class="fa-brands fa-facebook"></i>
          <span>Facebook</span>
        </div>
        <i class="fa-solid fa-arrow-up-right-from-square chevron-icon"></i>
      </a>


      <a href="https://www.instagram.com/blal.ahmed_/" target="_blank" class="social-link" id="link-instagram">
        <div class="social-left">
          <i class="fa-brands fa-instagram"></i>
          <span>Instagram</span>
        </div>
        <i class="fa-solid fa-arrow-up-right-from-square chevron-icon"></i>
      </a>

      <a href="https://t.me/BLAL2AHMED" target="_blank" class="social-link" id="link-telegram">
        <div class="social-left">
          <i class="fa-brands fa-telegram"></i>
          <span>Telegram</span>
        </div>
        <i class="fa-solid fa-arrow-up-right-from-square chevron-icon"></i>
      </a>

      <a href="https://wa.me/201279102217" target="_blank" class="social-link" id="link-whatsapp">
        <div class="social-left">
          <i class="fa-brands fa-whatsapp"></i>
          <span>WhatsApp</span>
        </div>
        <i class="fa-solid fa-arrow-up-right-from-square chevron-icon"></i>
      </a>
    </div>
  </div>

  <footer class="footer">
    <div class="created-by-container">
      <img src="created_by.png" alt="Creator Logo" class="creator-logo">
    </div>
  </footer>

  <script>
    // Motion Background (Interactive Fluid Particle Field)
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');

    let w, h;
    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const particles = [];
    const count = 35;

    // Fluid neon colors
    const colors = [
      'rgba(99, 102, 241, 0.15)',  // Indigo
      'rgba(168, 85, 247, 0.15)',  // Purple
      'rgba(236, 72, 153, 0.15)',  // Pink
      'rgba(59, 130, 246, 0.12)'   // Blue
    ];

    class Particle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * w;
        this.y = Math.random() * h;
        this.r = Math.random() * 80 + 40; // Soft large blur circles
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.vx = (Math.random() - 0.5) * 0.4;
        this.vy = (Math.random() - 0.5) * 0.4;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        // Bounce/Wrap boundaries gently
        if (this.x < -this.r) this.x = w + this.r;
        if (this.x > w + this.r) this.x = -this.r;
        if (this.y < -this.r) this.y = h + this.r;
        if (this.y > h + this.r) this.y = -this.r;
      }

      draw() {
        ctx.beginPath();
        let grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r);
        grad.addColorStop(0, this.color);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < count; i++) {
      particles.push(new Particle());
    }

    function animate() {
      ctx.fillStyle = '#050508';
      ctx.fillRect(0, 0, w, h);

      particles.forEach(p => {
        p.update();
        p.draw();
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
